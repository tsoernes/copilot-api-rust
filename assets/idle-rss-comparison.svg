<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Idle process-tree RSS comparison</title>
  <desc id="desc">Measured idle RSS: npx 307 MiB, bunx 111 MiB, Rust 16.9 MiB.</desc>
  <rect width="900" height="360" rx="18" fill="#101820"/>
  <text x="44" y="52" fill="#f2f6fa" font-family="Inter,Segoe UI,sans-serif" font-size="25" font-weight="700">Idle memory (RSS)</text>
  <text x="44" y="80" fill="#9fb0bf" font-family="Inter,Segoe UI,sans-serif" font-size="14">Process-tree snapshot · MiB · measured 25 Nov 2026</text>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="15" fill="#d5e0e8">
    <text x="44" y="145">npx · Node</text>
    <text x="44" y="220">bunx · Node runtime</text>
    <text x="44" y="295">Rust · native binary</text>
  </g>
  <g>
    <rect x="250" y="118" width="500" height="38" rx="8" fill="#32404c"/>
    <rect x="250" y="118" width="500" height="38" rx="8" fill="#fb923c"/>
    <rect x="250" y="193" width="500" height="38" rx="8" fill="#32404c"/>
    <rect x="250" y="193" width="181" height="38" rx="8" fill="#38bdf8"/>
    <rect x="250" y="268" width="500" height="38" rx="8" fill="#32404c"/>
    <rect x="250" y="268" width="28" height="38" rx="8" fill="#4ade80"/>
  </g>
  <g font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="700">
    <text x="770" y="144" fill="#fdba74">307 MiB</text>
    <text x="451" y="219" fill="#7dd3fc">111 MiB</text>
    <text x="292" y="294" fill="#86efac">16.9 MiB</text>
  </g>
  <text x="44" y="337" fill="#8495a4" font-family="Inter,Segoe UI,sans-serif" font-size="12">Single-host idle measurement, not a universal benchmark. Runtime caches warm; workload changes RSS.</text>
</svg>
